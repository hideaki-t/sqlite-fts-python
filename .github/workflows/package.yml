name: Python package

on: [push]
#  push:
#    branches: [ master ]
#  pull_request:
#    branches: [ master ]

jobs:
    build:
        runs-on: ${{ matrix.os }}
        continue-on-error: ${{ matrix.experimental }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest, ubuntu-24.04-arm]
                python-version:
                    [
                        "3.11",
                        "3.12",
                        "3.13",
                        "3.14",
                        "3.15",
                        "3.15t",
                        "pypy3.12",
                    ]
                experimental: [false]
                include:
                    - python-version: "3.15"
                      os: windows-11-arm
                      experimental: false
                    - python-version: "3.15t"
                      os: windows-11-arm
                      experimental: false

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: ${{ matrix.python-version }}
                  allow-prereleases: true
                  cache: pip
            - name: tox-gh workaround for freethreaded(!windows)
              if: ${{ runner.os != 'Windows' && endsWith(matrix.python-version, 't') }}
              run: echo "TOX_GH_MAJOR_MINOR=${{ matrix.python-version }}" >> $GITHUB_ENV
            - name: tox-gh workaround for freethreaded(windows)
              if: ${{ runner.os == 'Windows' && endsWith(matrix.python-version, 't') }}
              run: echo "TOX_GH_MAJOR_MINOR=${{ matrix.python-version }}" >> $env:GITHUB_ENV
            - name: Install dependencies
              run: |
                  python3 -m pip install 'tox' 'tox-gh'
                  tox --version
            - name: Install native deps (Linux)
              if: runner.os == 'Linux'
              run: |
                  sudo apt update
                  sudo apt install -y mecab libmecab-dev mecab-ipadic-utf8
            - name: Test with tox
              run: |
                  tox
